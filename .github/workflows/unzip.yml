name: Extract SX Converter

on:
  push:
    paths:
      - "SX-CONVERTER.zip"
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          shopt -s dotglob nullglob

          ROOTS=(extracted/*)

          if [ ${#ROOTS[@]} -eq 1 ] && [ -d "${ROOTS[0]}" ]; then
            cp -a "${ROOTS[0]}"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f "$ZIP_FILE"

      - name: Commit files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Extract SX Converter project"
            git push
          fi
