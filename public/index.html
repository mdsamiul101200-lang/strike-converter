<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070b"><title>SX CONVERTER</title><link rel="stylesheet" href="/styles.css"></head><body><div class="orb orb1"></div><div class="orb orb2"></div><main class="app"><header><div class="brand"><span class="logo">↔</span><span>SX CONVERTER</span></div><span id="ready" class="status">READY</span></header><section class="panel"><div id="drop" class="drop"><input id="file" type="file" hidden><button id="choose" class="primary">CHOOSE FILE</button><button id="paste" class="ghost">PASTE</button><div id="pasteBox" class="paste hidden"><textarea id="pasteText" placeholder="Paste content"></textarea><button id="usePaste" class="primary">USE</button></div></div><div id="fileCard" class="file-card hidden"><div><b id="fileName"></b><small id="fileMeta"></small></div><button id="remove" class="remove">REMOVE</button></div><div class="selectors"><label>INPUT FORMAT<select id="inputFmt"></select></label><label>OUTPUT FORMAT<select id="outputFmt"></select></label></div><button id="convert" class="convert" disabled>CONVERT</button><div id="processing" class="state hidden"><span class="spinner"></span><b id="stateText">PROCESSING</b></div><div id="result" class="result hidden"><div><b>CONVERSION COMPLETE</b><small id="resultMeta"></small></div><a id="download" class="download" href="#">DOWNLOAD</a><button id="again" class="ghost full">CONVERT AGAIN</button></div><div id="error" class="error hidden"></div></section></main><script src="/app.js"></script></body></html>
